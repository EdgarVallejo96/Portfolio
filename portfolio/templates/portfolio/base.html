<!DOCTYPE html>
{% load static %}
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}{{ ui.hero_name }} | {{ ui.eyebrow }}{% endblock %}</title>
    <meta name="description" content="{{ ui.meta_description }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link rel="icon" href="{% static 'images/favicon.svg' %}" type="image/svg+xml">
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="#top" class="logo">EDGAR<span>.VALLEJO</span></a>
            <div class="header-right">
                <div class="lang-switch" role="group" aria-label="Language">
                    <a href="{% url 'portfolio:set_language' 'en' %}?next={{ request.path }}" class="lang-btn{% if lang == 'en' %} active{% endif %}">EN</a>
                    <a href="{% url 'portfolio:set_language' 'es' %}?next={{ request.path }}" class="lang-btn{% if lang == 'es' %} active{% endif %}">ES</a>
                </div>
                <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
            </div>
            <nav class="site-nav" id="siteNav">
                <a href="#about" class="nav-link">{{ ui.nav_about }}</a>
                <a href="#experience" class="nav-link">{{ ui.nav_experience }}</a>
                <a href="#projects" class="nav-link">{{ ui.nav_projects }}</a>
                <a href="#contact" class="nav-link">{{ ui.nav_contact }}</a>
            </nav>
        </div>
    </header>

    <main id="top">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <p>&copy; {% now "Y" %} Edgar Vallejo. {{ ui.footer_rights }}</p>
            <div class="social-links">
                <a href="{{ github_url }}" target="_blank" rel="noopener" aria-label="GitHub profile">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M12 .5C5.65.5.5 5.65.5 12c0 5.09 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55 0-.27-.01-1.17-.02-2.12-3.2.7-3.87-1.36-3.87-1.36-.53-1.34-1.28-1.7-1.28-1.7-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.74.4-1.25.72-1.54-2.56-.29-5.25-1.28-5.25-5.7 0-1.26.45-2.29 1.19-3.1-.12-.29-.52-1.46.11-3.05 0 0 .97-.31 3.18 1.18a11.1 11.1 0 0 1 5.79 0c2.21-1.49 3.18-1.18 3.18-1.18.63 1.59.23 2.76.11 3.05.74.81 1.19 1.84 1.19 3.1 0 4.43-2.7 5.41-5.27 5.7.42.36.78 1.07.78 2.15 0 1.56-.01 2.81-.01 3.19 0 .3.21.66.79.55A11.51 11.51 0 0 0 23.5 12c0-6.35-5.15-11.5-11.5-11.5Z"/></svg>
                </a>
                <a href="{{ linkedin_url }}" target="_blank" rel="noopener" aria-label="LinkedIn profile">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M20.45 20.45h-3.55v-5.57c0-1.33-.02-3.03-1.85-3.03-1.85 0-2.14 1.44-2.14 2.94v5.66H9.36V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.38-1.85 3.61 0 4.28 2.38 4.28 5.47v6.27ZM5.34 7.43a2.06 2.06 0 1 1 0-4.12 2.06 2.06 0 0 1 0 4.12ZM7.12 20.45H3.56V9h3.56v11.45ZM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0Z"/></svg>
                </a>
                <a href="mailto:{{ contact_email }}" aria-label="Send email">
                    <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M2 4h20a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1Zm19 2.24-8.6 6.45a2 2 0 0 1-2.4 0L1 6.24V19h20V6.24ZM1.76 4l9.24 6.93L20.24 4H1.76Z"/></svg>
                </a>
            </div>
        </div>
    </footer>

    <div class="lightbox" id="lightbox" aria-hidden="true">
        <button type="button" class="lightbox-close" id="lightboxClose" aria-label="Close">&times;</button>
        <img src="" alt="" class="lightbox-image" id="lightboxImage">
    </div>

    <script src="{% static 'js/main.js' %}"></script>
</body>
</html>
